<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">

  .go { margin-top: 34px; }
</style></head>

<div class="cam" data-cam="0:560 80 800 420; 1.6:full">
  <div class="end">
    <div class="ring a-zoom" style="--at: .1"><i></i><i class="l-spin" style="--at: .1"></i><i class="l-pulse" style="--at: .1"></i></div>
    <div class="word accent a-up" style="--at: .5">javis</div>
    <div class="link mono a-pop" style="--at: 2"><span class="a-wipe" style="--at: 2.3; display: inline-block">javis.bcsmethai.com</span></div>
    <div class="h3 go a-up" style="--at: calc(var(--p2) + .1)">🎙️ เปิดเว็บ แล้วพูดได้เลย</div>
  </div>
</div>
