<!doctype html>
<html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  .zone { position: absolute; top: 150px; width: 560px; height: 640px; }
  .phones { display: grid; grid-template-columns: repeat(2, 200px); gap: 40px 60px; justify-content: center; padding-top: 70px; }
  .ph { position: relative; width: 200px; height: 160px; display: grid; place-items: center; }
  .ph .icon { width: 150px; height: 150px; font-size: 84px; border-radius: 40px; background: rgba(251, 113, 133, .12); border-color: rgba(251, 113, 133, .5); }
  .ph .halo { position: absolute; width: 150px; height: 150px; border-radius: 40px; border: 3px solid var(--rose); }
  .q { position: absolute; left: 40px; font-size: 36px; }
  .staff { display: flex; gap: 36px; justify-content: center; padding-top: 120px; }
  .staff .icon { width: 140px; height: 140px; font-size: 80px; border-radius: 50%; }
  .tag { display: block; text-align: center; margin-top: 18px; }
  .ask { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
  .ask .ring { margin: 0 auto 40px; }
  .dim { position: absolute; inset: 0; background: rgba(5, 8, 22, .9); backdrop-filter: blur(8px); }
</style></head>
<body>
<div class="cam" data-cam="0:60 100 560 760; p2:680 100 560 760; p3:1300 100 560 760; p4-0.4:full">
  <div class="zone" style="left: 60px">
    <div class="eyebrow a-fade" style="--at: .2; text-align: center">สายเข้า</div>
    <div class="phones">
      <div class="ph a-pop" style="--at: .5"><i class="halo l-ring" style="--at: .6"></i><div class="icon l-pulse">📞</div></div>
      <div class="ph a-pop" style="--at: .8"><i class="halo l-ring" style="--at: 1"></i><div class="icon l-pulse">📞</div></div>
      <div class="ph a-pop" style="--at: 1.1"><i class="halo l-ring" style="--at: 1.3"></i><div class="icon l-pulse">📞</div></div>
      <div class="ph a-pop" style="--at: 1.4"><i class="halo l-ring" style="--at: 1.6"></i><div class="icon l-pulse">📞</div></div>
    </div>
    <div class="chip chip-red a-up" style="--at: 1.8; display: flex; width: fit-content; margin: 60px auto 0">● สายรอ…</div>
  </div>
  <div class="zone" style="left: 680px">
    <div class="eyebrow a-fade" style="--at: calc(var(--p2) - .2); text-align: center">คำถามเดิม</div>
    <div class="bubble q a-drop" style="--at: calc(var(--p2) + .1); top: 110px">ต้นทุนคิดยังไงครับ?</div>
    <div class="bubble q a-drop" style="--at: calc(var(--p2) + .5); top: 270px; left: 110px">ต้นทุนคิดยังไงครับ?</div>
    <div class="bubble q a-drop" style="--at: calc(var(--p2) + .9); top: 430px">ต้นทุนคิดยังไงครับ?</div>
    <div class="chip chip-amber a-pop" style="--at: calc(var(--p2) + 1.4); position: absolute; right: 10px; top: 560px">ซ้ำทั้งวัน</div>
  </div>
  <div class="zone" style="left: 1300px">
    <div class="eyebrow a-fade" style="--at: calc(var(--p3) - .2); text-align: center">ทีมรับสาย</div>
    <div class="staff">
      <div class="a-up" style="--at: calc(var(--p3) + .1)"><div class="icon">👩‍💼</div><span class="chip chip-red tag a-pop" style="--at: calc(var(--p3) + .9)">ไม่ว่าง</span></div>
      <div class="a-up" style="--at: calc(var(--p3) + .3)"><div class="icon">🧑‍💼</div><span class="chip chip-red tag a-pop" style="--at: calc(var(--p3) + 1.1)">ไม่ว่าง</span></div>
      <div class="a-up" style="--at: calc(var(--p3) + .5)"><div class="icon">👨‍💼</div><span class="chip chip-red tag a-pop" style="--at: calc(var(--p3) + 1.3)">ไม่ว่าง</span></div>
    </div>
  </div>
</div>
<div class="dim a-fade" style="--at: calc(var(--p4) - .2)"></div>
<div class="ask">
  <div class="ring a-zoom" style="--at: var(--p4)"><i></i><i class="l-spin" style="--at: var(--p4)"></i><i class="l-pulse" style="--at: var(--p4)"></i></div>
  <div class="h1 a-up" style="--at: calc(var(--p4) + .5)">ถ้ามี<span class="accent">เลขา</span>รับสายแรกแทน</div>
  <div class="h3 a-up" style="--at: calc(var(--p4) + 1.6); color: #c9d0e6; margin-top: 18px">และตอบจากข้อมูลจริง?</div>
</div>
<script src="common.js"></script>
</body></html>
