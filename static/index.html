<!doctype html>
<html lang="th">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผู้ช่วยเสียงภาษาไทย</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(60% 45% at 15% 0%,rgba(124,58,237,.28),transparent),radial-gradient(50% 40% at 90% 5%,rgba(14,165,233,.24),transparent),radial-gradient(70% 50% at 50% 105%,rgba(236,72,153,.2),transparent),#05070f;color:#e8ecf5;font-family:"Noto Sans Thai","Leelawadee UI","Sarabun",Tahoma,sans-serif}
button,summary{font:inherit;color:inherit}
:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
.glass{background:rgba(10,14,28,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:12px}

/* top bar: every child is 40px tall and centered on the same line */
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:5}
#top h1{margin:0;font-size:18px;font-weight:600;height:40px;line-height:40px;margin-right:auto}
#top .hint{height:40px;line-height:40px;font-size:14px;color:#aab4cc}
.btn{height:40px;padding:0 18px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:#0e7490;border-color:#22d3ee}
.btn.danger{background:#9f1239;border-color:#fb7185}
.btn[aria-pressed="true"]{background:#92400e;border-color:#fbbf24}

/* device picker: native <details> dropdown under its 40px summary button */
#dev{position:relative}
#dev summary{list-style:none}
#dev summary::-webkit-details-marker{display:none}
#dev>div{position:absolute;right:0;top:48px;width:min(320px,90vw);padding:12px;display:flex;flex-direction:column;gap:10px;z-index:7}
#top:has(#dev[open]){z-index:7} /* the popover's own 7 only counts inside #top (fixed = own stacking context), under #note and #hud at 6 */
#dev .f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#aab4cc}
#dev .row{display:flex;align-items:center;gap:8px}
#dev .row .btn{height:36px;padding:0 12px;font-size:13px;flex:none}
#dev meter{width:100%;height:10px}
#dev select{flex:1;min-width:0;height:36px;border-radius:8px;background:#0b1020;color:#e8ecf5;border:1px solid rgba(255,255,255,.2);padding:0 8px;font:inherit;font-size:14px}

#note{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:8px 16px;z-index:6;font-size:14px;color:#fde68a}
#note:empty{display:none}

/* the side columns' widths, one place: narrower on a laptop so the panel keeps room */
:root{--lw:280px;--cw:min(320px,42vw)}
@media (min-width:901px) and (max-width:1279px){:root{--lw:220px;--cw:240px}}
#left{position:fixed;left:16px;top:72px;bottom:196px;width:var(--lw);max-width:80vw;z-index:4;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#left>details{pointer-events:auto;display:flex;flex-direction:column;padding:8px 12px;min-height:0}
#tr[open]{flex:1}
/* team panel: one row per member, dot + name + status share one line */
#teamlist{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.5;max-height:34vh;overflow-y:auto}
#teamlist li{padding:3px 4px;border-top:1px solid rgba(255,255,255,.06);cursor:pointer;border-radius:6px}
#teamlist li:hover{background:rgba(255,255,255,.06)}
#teamlist .row{display:flex;align-items:center;gap:8px;height:22px}
#teamlist .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);opacity:.3}
#teamlist .run .dot{opacity:1;box-shadow:0 0 8px var(--c);animation:pulse 1s ease-in-out infinite}
#teamlist .done .dot{opacity:1}
#teamlist .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#teamlist .st{flex:none;color:#7d89a6;white-space:nowrap}
#teamlist .run .st{color:#fbbf24}#teamlist .done .st{color:#4ade80}#teamlist .none .st{color:#f87171}
#teamlist .tk{padding-left:18px;color:#7d89a6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#teamlist .tk:empty{display:none}
#teamlist .boss .nm{color:#67e8f9}
@keyframes pulse{50%{transform:scale(1.45)}}
#tr summary,#team summary{cursor:pointer;height:28px;line-height:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trlist{list-style:none;margin:8px 0 0;padding:0;overflow-y:auto;flex:1;font-size:14px;line-height:1.5}
#trlist li{margin-bottom:6px}
#trlist .u{color:#67e8f9}
#trlist .b{color:#e8ecf5}

/* cards: one group per question, newest on top, all kept to scroll back to; every card opens in the panel */
#cards{position:fixed;right:16px;top:72px;bottom:16px;width:var(--cw);display:flex;flex-direction:column;gap:10px;overflow-y:auto;z-index:4;perspective:900px}
.turn{display:flex;flex-direction:column;gap:6px}
.turn>h4{margin:4px 2px 0;font-size:12px;line-height:18px;color:#67e8f9;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{display:block;padding:8px 10px;color:inherit;text-decoration:none;transform-origin:right center;animation:cin .6s cubic-bezier(.2,.8,.2,1) both}
a.card:hover{border-color:#a78bfa;background:rgba(30,27,75,.7)}
@keyframes cin{from{opacity:0;transform:translateX(60px) rotateY(-28deg)}to{opacity:1;transform:none}}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#05070f;font-weight:600}
.badge.web{background:#60a5fa}.badge.docs{background:#4ade80}.badge.bcbrain{background:#fb923c}.badge.gmail{background:#f87171}.badge.calendar{background:#a78bfa}.badge.drive{background:#facc15}.badge.desktop{background:#2dd4bf}.badge.calc{background:#e879f9}.badge.deepseek{background:#818cf8}.badge.other{background:#9ca3af}
.card h3{margin:4px 0 2px;font-size:14px;line-height:1.35}
.card p{margin:0;font-size:12.5px;line-height:1.45;color:#c3cbe0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* the HUD ring floats over everything (ลุงจืด 2026-11-09 "เอาลอยไว้ด้านหน้า ปรับขนาดได้ ย้ายได้"): drag it, drag its corner
   to resize, double-click puts it back here; its color is the state, its spin how hard it works */
#hud{position:fixed;left:calc(100vw - 174px);top:calc(100vh - 174px);width:150px;aspect-ratio:1;z-index:6;color:#7fa6e0;transition:color .6s;cursor:grab;touch-action:none;user-select:none;container-type:inline-size}
#hud[data-s=listening]{color:#22d3ee}#hud[data-s=thinking],#hud[data-s=searching]{color:#fbbf24}#hud[data-s=speaking]{color:#a78bfa}
#hud.drag{cursor:grabbing}
#hud::before{content:"";position:absolute;inset:3%;border-radius:50%;background:radial-gradient(circle,rgba(6,10,22,.85) 60%,rgba(6,10,22,.4) 72%,transparent 73%);backdrop-filter:blur(6px)}
#hud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px currentColor)}
#pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:56%;font-size:clamp(10px,9cqw,24px);line-height:1.3;color:#e8ecf5;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hud .grip{position:absolute;right:0;bottom:0;width:18px;height:18px;border:solid currentColor;border-width:0 2px 2px 0;border-radius:0 0 6px 0;cursor:nwse-resize;opacity:0;transition:opacity .2s}
#hud:hover .grip,#hud.drag .grip{opacity:.8}
@media (hover:none){#hud .grip{opacity:.5}}

#subs{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);width:min(760px,calc(100vw - 600px));min-width:300px;padding:12px 20px;text-align:center;z-index:3;background:radial-gradient(ellipse at center,rgba(5,7,15,.75),rgba(5,7,15,.35));border-radius:16px}
#subs:has(#bot:empty):has(#user:empty){visibility:hidden}
/* chat bar: input and button share one 40px line */
#chat{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100vw - 700px));min-width:300px;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;border-radius:24px;z-index:5;margin:0}
#chat:focus-within{border-color:#22d3ee}
#chat input{flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;color:#e8ecf5;font:inherit;font-size:16px;padding:0 8px}
#chat input::placeholder{color:#7d89a6}
#user{font-size:18px;color:#67e8f9;margin-bottom:4px;min-height:0}
#bot{font-size:30px;line-height:1.4;color:#fff;max-height:4.3em;overflow:hidden;text-shadow:0 2px 8px #000}
#bot span{animation:sin .5s ease-out both}
@keyframes sin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* panel mode, always on (ลุงจืด 2026-11-04 "เน้นแสดงข้อมูลแน่นๆ"): the info panel fills the screen, the HUD floats over it */
#panel{position:fixed;left:calc(var(--lw) + 32px);right:calc(var(--cw) + 32px);top:72px;bottom:184px;z-index:3;display:flex;flex-direction:column;padding:12px 18px;animation:pin .5s ease both}
#panel .ph{display:flex;align-items:center;gap:10px;margin:0 0 6px}
#panel h2{margin:0;flex:1;min-width:0;font-size:15px;line-height:30px;color:#aab4cc;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pback{height:30px;padding:0 12px;font-size:13px;flex:none}
#pback[hidden]{display:none}
#pbody:empty::before{content:"ถามได้เลย คำตอบละเอียดจะแสดงตรงนี้ · กดการ์ดด้านขวาหรือแถวลูกทีมเพื่อดูต่อ";color:#7d89a6}
@keyframes pin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.md{font-size:clamp(15px,.45vw + 10px,19px);line-height:1.65;overflow-wrap:anywhere}
#pbody{flex:1;min-height:0;overflow-y:auto}
.md h3{font-size:1.4em;margin:.5em 0 .3em}.md h4{font-size:1.2em;margin:.5em 0 .3em}.md h5{font-size:1.05em;margin:.5em 0 .3em}
.md p{margin:.4em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.4em}
.md table{border-collapse:collapse;margin:.6em 0;width:100%}
.md th,.md td{border:1px solid rgba(255,255,255,.18);padding:5px 10px;text-align:left}
.md th{background:rgba(255,255,255,.08)}
.md code{background:rgba(255,255,255,.12);padding:0 5px;border-radius:4px;font-family:Consolas,monospace;font-size:.92em}
.md pre{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;margin:.6em 0;overflow-x:auto}
.md pre code{background:none;padding:0;white-space:pre}
.md a{color:#7dd3fc}
.md a.wl{color:#f0abfc;text-decoration:underline dotted}
.md .fi{animation:sin .5s ease-out both}
/* tables (ลุงจืด 2026-11-09 "motion graphic"): rows slide in one after another, a light sweeps each new row and its
   numbers count up; a wide table scrolls sideways instead of squeezing its columns */
.md .tw{max-width:100%;overflow-x:auto}
.md tr.in{animation:rin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r,0) * 140ms)}
.md tr.in td{animation:rsweep 1.4s ease-out both;animation-delay:calc(var(--r,0) * 140ms + .15s)}
@keyframes rin{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes rsweep{0%{background:rgba(167,139,250,.38)}100%{background:transparent}}
/* [ขั้นตอน] a → b → c: steps pop in one by one, numbered, arrows between, a glow runs along them */
.md .flow{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;margin:.7em 0;padding:0;counter-reset:st}
.md .flow li{position:relative;padding:6px 12px 6px 36px;border-radius:10px;background:rgba(124,58,237,.18);border:1px solid rgba(167,139,250,.45);counter-increment:st;animation:fpop .45s cubic-bezier(.2,.8,.2,1) both,fglow 3s ease-in-out infinite;animation-delay:calc(var(--i) * .25s),calc(var(--i) * 3s / var(--n))}
.md .flow li::before{content:counter(st);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:#a78bfa;color:#05070f;font-size:12px;font-weight:700;line-height:20px;text-align:center}
/* the mark over a numbered list: long steps go one under another, arrows point down */
.md .flow.col{flex-direction:column;align-items:stretch;gap:16px}
.md .flow.col li:not(:last-child)::after{content:"↓";right:auto;left:14px;top:auto;bottom:-17px;transform:none}
.md .flow li.seen{animation-name:none,fglow}  /* already on screen while the answer streams: no second pop */
.md .flow li:not(:last-child)::after{content:"→";position:absolute;right:-22px;top:50%;transform:translateY(-50%);color:#f0abfc;font-weight:700}
@keyframes fpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fglow{0%,60%,100%{box-shadow:none}30%{box-shadow:0 0 16px rgba(240,171,252,.85);border-color:#f0abfc}}
/* [แผนที่] place @lat,lon: OpenStreetMap embed, their credit shown */
.md .map{margin:.7em 0}.md .map iframe{display:block;width:100%;height:260px;border:0;border-radius:10px;background:#0b1020}
.md .map figcaption{font-size:13px;color:#aab4cc;margin-top:4px}
#trlist summary{height:auto;line-height:1.5;font-weight:400;color:#aab4cc}
#trlist .md{font-size:13px;padding-top:4px}
body.panel #subs{left:calc(var(--lw) + 32px);right:calc(var(--cw) + 32px);width:auto;min-width:0;transform:none;bottom:76px;padding:8px 16px}
body.panel #chat{left:calc(var(--lw) + 32px);right:calc(var(--cw) + 32px);width:auto;min-width:0;transform:none}
body.panel #bot{font-size:22px;max-height:2.9em}
body.panel #user{font-size:15px}
@media (max-width:900px){
  /* phone: HUD top right, panel in the middle, a row of cards above the subtitles and the chat bar */
  #top{gap:6px;padding:12px 8px}#top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#top .btn{padding:0 12px;white-space:nowrap}
  #panel{left:8px;right:8px;top:72px;bottom:296px}
  #hud{left:calc(100vw - 92px);top:68px;width:84px}
  body.panel #subs{left:8px;right:8px;bottom:186px}body.panel #bot{font-size:18px}
  body.panel #chat{left:8px;right:8px}
  #cards{top:auto;bottom:64px;left:8px;right:8px;width:auto;height:118px;flex-direction:row;overflow:auto hidden}
  .turn{flex-direction:row}.turn>h4{display:none}.card{flex:0 0 72vw}
  #top .hint{display:none}#left{display:none}
  #dev{position:static}#dev>div{position:fixed;left:8px;right:8px;top:64px;width:auto} /* the 320px popover ran off the left edge */
}
@media (prefers-reduced-motion:reduce){#teamlist .dot,.card,#bot span,.gt,#panel,.md .fi,.md .flow li,.md tr.in,.md tr.in td{animation:none}}
</style>
</head>
<body class="panel">
<header id="top">
  <h1>ผู้ช่วยเสียงภาษาไทย</h1>
  <span class="hint">ควรใส่หูฟัง</span>
  <details id="dev">
    <summary class="btn" aria-label="เลือกไมค์และลำโพง">อุปกรณ์</summary>
    <div class="glass">
      <div class="f"><label for="micSel">ไมค์ (ลองพูด แถบต้องขยับ)</label><select id="micSel"></select>
        <meter id="micLvl" min="0" max="1" value="0" aria-label="ระดับเสียงไมค์"></meter></div>
      <div class="f"><label for="spkSel">ลำโพง</label>
        <div class="row"><select id="spkSel"></select><button id="spkTest" class="btn" type="button">ทดสอบเสียง</button></div></div>
    </div>
  </details>
  <button id="micBtn" class="btn" type="button" disabled aria-label="เปิดหรือปิดไมค์" aria-pressed="false">ปิดไมค์</button>
  <button id="callBtn" class="btn primary" type="button">เริ่มคุย</button>
</header>
<div id="note" class="glass" role="status" aria-live="polite"></div>
<div id="left">
<details id="team" class="glass" open>
  <summary id="teamsum">ทีมงาน</summary>
  <ul id="teamlist"></ul>
</details>
<details id="tr" class="glass" open>
  <summary>บทสนทนา</summary>
  <ul id="trlist"></ul>
</details>
</div>
<div id="hud" data-s="idle" title="ลากเพื่อย้าย · ลากมุมขวาล่างเพื่อย่อขยาย · ดับเบิลคลิกเพื่อคืนที่เดิม">
<svg viewBox="-100 -100 200 200" fill="none" stroke="currentColor" aria-hidden="true">
<g id="r1"><circle r="97" stroke-width="5" stroke-dasharray="0.8 4.28" opacity=".45"/><circle r="96" stroke-width="9" stroke-dasharray="1 24.13" opacity=".9"/></g>
<g id="r2"><circle r="88" stroke-width="3" stroke-dasharray="60 8 20 8 110 30 14 8 90 40 30 8 128 11" opacity=".85"/></g>
<g id="r3"><circle r="77" stroke-width="1.5" stroke-dasharray="300 184"/><circle r="77" stroke-width="6" stroke-dasharray="2 3.4 2 3.4 2 3.4 2 467" opacity=".9"/></g>
<circle r="69" stroke-width="6" stroke-dasharray="2 3.42" opacity=".25"/>
<circle id="core" r="56" stroke-width="3"/><circle id="ping" r="56" stroke-width="2" opacity="0"/>
<g id="sats" stroke="none"></g>
</svg>
<div id="pill" role="status" aria-live="polite">พร้อมคุย</div><i class="grip" aria-hidden="true"></i>
</div>
<section id="panel" class="glass" aria-label="ข้อมูล"><div class="ph"><button id="pback" class="btn" type="button" hidden>‹ ย้อนกลับ</button><h2 id="ptitle">ข้อมูล</h2></div><div id="pbody" class="md"></div></section>
<div id="cards" aria-label="ข้อมูลที่เกี่ยวข้อง"></div>
<div id="subs" aria-live="polite"><div id="user"></div><div id="bot"></div></div>
<form id="chat" class="glass" autocomplete="off"><input id="chatIn" maxlength="500" placeholder="พิมพ์ถามแทนการพูด แล้วกด Enter" aria-label="พิมพ์ข้อความถึงผู้ช่วย"><button class="btn primary" type="submit">ส่ง</button></form>
<audio id="remote" autoplay hidden></audio>

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const demo = new URLSearchParams(location.search).get("demo") === "1";
const LABEL = { idle: "พร้อมคุย", listening: "กำลังฟัง…", thinking: "กำลังคิด…", searching: "กำลังคิด…", speaking: "กำลังพูด…" };
const SPIN = { idle: 0.15, listening: 0.3, thinking: 1.2, searching: 1.2, speaking: 0.5 }; // the HUD's spin per state, its color is CSS
const SRC = { web: ["เว็บ", 0x60a5fa], docs: ["เอกสารในเครื่อง", 0x4ade80], bcbrain: ["คลังความรู้ BC", 0xfb923c],
  gmail: ["อีเมล", 0xf87171], calendar: ["ปฏิทิน", 0xa78bfa], drive: ["Google Drive", 0xfacc15], desktop: ["คอมพิวเตอร์", 0x2dd4bf],
  calc: ["เครื่องคิดเลข", 0xe879f9], deepseek: ["ความรู้ทั่วไป", 0x818cf8] };
const OTHER_COLOR = 0x9ca3af; // any source string not in SRC

let state = "idle", statusText = "", userLevel = 0, botLevel = 0, panelText = "", panelBlocks = 0;
const ui = { call: $("callBtn"), mic: $("micBtn"), pill: $("pill"), user: $("user"), bot: $("bot"), cards: $("cards"), list: $("trlist"), note: $("note") };

/* ---------- UI state ---------- */
function render() { ui.pill.textContent = statusText || LABEL[state]; }
function setState(s) {
  if (s !== state) pulse = Math.max(pulse, 0.6); // every state change rings out from the HUD
  state = s; render(); hud.dataset.s = s;
  if (team.boss) { team.boss.st.textContent = BOSS[s]; team.boss.li.className = "boss" + (s === "idle" ? "" : " run"); }
}
function notice(msg) { ui.note.textContent = msg; }

let botLi = null;
function onEvent(ev) {
  if (ev.kind === "user") {
    archivePanel(); hidePanel(); resetTeam(); $("remote").volume = 1; turnText = ev.text; turnBox = null;
    statusText = ""; ui.user.textContent = ev.text ? "คุณ: " + ev.text : ""; ui.bot.textContent = "";
    if (ev.text) ui.list.append(el("li", "u", "คุณ: " + ev.text)); // "" = the secretary speaks first (greeting, reminder)
    botLi = el("li", "b", "ผู้ช่วย: "); ui.list.append(botLi);
    setState("thinking");
  } else if (ev.kind === "bot") {
    statusText = ""; ui.bot.append(el("span", "", ev.text)); ui.bot.scrollTop = ui.bot.scrollHeight;

    else if (/^\*\*[^*]+\*\*$/.test(part)) parent.append(el("strong", "", part.slice(2, -2)));

const FENCE = /^\s*```/; // ```sql … ```: a query keeps its lines and spaces (log 2026-11-08 06:33 asked for one)

const NUM_CELL = /^-?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/, CALM = matchMedia("(prefers-reduced-motion: reduce)");
function countUp(td, delay) { // a number cell runs up to its value and ends on the exact text the boss wrote
  const s = td.textContent.trim();
  if (CALM.matches || td.childElementCount || !NUM_CELL.test(s)) return;
  const v = +s.replace(/,/g, ""), dec = (s.split(".")[1] || "").length, t0 = performance.now() + delay;
  const fmt = { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: s.includes(",") };

function renderMd(box, text, animateFrom = Infinity) { // blocks that did not change stay put: a map replaced would reload
  const blocks = mdBlocks(text), old = [...box.children]; let k = 0;

  if (old[k]?.matches(".flow") && blocks[k]?.matches(".flow")) // a flow still streaming in: its steps on screen do not pop again
    [...blocks[k].children].slice(0, old[k].children.length).forEach((li) => li.classList.add("seen"));
  // a table still streaming in: its rows on screen stay put, only the new ones slide in
  const grows = animateFrom !== Infinity && old[k]?.matches(".tw") && blocks[k]?.matches(".tw");
  if (grows) [...blocks[k].querySelectorAll("tbody tr")].slice(0, old[k].querySelectorAll("tbody tr").length).forEach((r) => r.classList.add("seen"));
  old.slice(k).forEach((b) => b.remove());

const nav = [], notes = new Map(); // nav: {title, nodes}; notes: slug -> text, fetched once per page
function openView(title, nodes) { nav.push({ title, nodes }); drawPanel(); return nav.at(-1); }
