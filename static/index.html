.md{font-size:calc(clamp(13.5px,.25vw + 11.2px,15.8px) * var(--zoom,1));line-height:1.5;overflow-wrap:anywhere}
.md h3{font-size:1.22em;margin:.55em 0 .22em;padding-left:.45em;border-left:3px solid #22d3ee;color:#f1f5f9}
.md h4{font-size:1.1em;margin:.48em 0 .2em;color:#e0f2fe}
.md h5{font-size:1em;margin:.4em 0 .18em;color:#cbd5e1}
.md>:first-child{margin-top:0}
.md p{margin:.28em 0}
.md ul,.md ol{margin:.28em 0;padding-left:1.35em}

.md .codebox .cpcode{position:absolute;top:6px;right:6px;z-index:1;height:22px;padding:0 8px;border-radius:8px;font-size:11.5px;background:rgba(15,23,42,.88)}

/* [ขั้นตอน] compact steps */
.md .flow{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:.35em 1.4em;margin:.5em 0;padding:0;counter-reset:st;font-size:.94em}
.md .flow li{position:relative;padding:.24em .62em .24em 1.9em;border-radius:8px;background:rgba(124,58,237,.18);border:1px solid rgba(167,139,250,.45);counter-increment:st;animation:fpop .35s cubic-bezier(.2,.8,.2,1) both,fglow 3s ease-in-out infinite;animation-delay:calc(var(--i) * .2s),calc(var(--i) * 3s / var(--n))}
.md .flow li::before{content:counter(st);position:absolute;left:.5em;top:50%;transform:translateY(-50%);width:1.45em;height:1.45em;border-radius:50%;background:#a78bfa;color:#05070f;font-size:.75em;font-weight:700;line-height:1.45em;text-align:center}
.md .flow.col{flex-direction:column;align-items:stretch;gap:.8em}
.md .flow.col li:not(:last-child)::after{content:"↓";right:auto;left:.75em;top:auto;bottom:-.95em;transform:none}
.md .flow li.seen{animation-name:none,fglow}
.md .flow li:not(:last-child)::after{content:"→";position:absolute;right:-1.05em;top:50%;transform:translateY(-50%);color:#f0abfc;font-weight:700}

#chat{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:3px 4px 3px 10px;border-radius:19px}
#chat:focus-within{border-color:#22d3ee}
#chat input{flex:1;min-width:0;height:30px;border:0;outline:0;background:transparent;color:#e8ecf5;font:inherit;font-size:calc(14.5px * clamp(.9,var(--zoom,1),1.25));padding:0 4px}
#chat input::placeholder{color:#7d89a6}
#chat button{height:30px;padding:0 14px;border-radius:15px;font-size:13.5px}

/* right cards sidebar: hidden when empty so center panel spans wider */
#right{flex:none;width:var(--rw);display:flex;flex-direction:column;padding:6px 8px;min-height:0}
#right[hidden]{display:none}
#right .rh{flex:none;display:flex;align-items:center;justify-content:space-between;height:28px;margin-bottom:4px;padding:0 2px;font-size:13px;font-weight:600;color:#cbd5e1}
#cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;perspective:900px}
#cards:empty::before{content:"การ์ดอ้างอิงที่ AI ค้นเจอจะแสดงตรงนี้";font-size:12.5px;color:#7d89a6;padding:6px 4px}
.turn{display:flex;flex-direction:column;gap:5px}
.turn>h4{margin:4px 2px 0;font-size:calc(11.5px * var(--zoom,1));line-height:1.35;color:#67e8f9;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{display:block;padding:6px 8px;color:inherit;text-decoration:none;border-radius:8px;background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.1);transform-origin:right center;animation:cin .45s cubic-bezier(.2,.8,.2,1) both}
a.card:hover{border-color:#22d3ee;background:rgba(14,116,144,.22)}
@keyframes cin{from{opacity:0;transform:translateX(36px) rotateY(-18deg)}to{opacity:1;transform:none}}
.card .ch{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;color:#05070f;font-weight:700;flex:none}
.badge.web{background:#60a5fa}.badge.docs{background:#4ade80}.badge.bcbrain{background:#fb923c}.badge.gmail{background:#f87171}.badge.calendar{background:#a78bfa}.badge.drive{background:#facc15}.badge.desktop{background:#2dd4bf}.badge.calc{background:#e879f9}.badge.message{background:#34d399}.badge.deepseek{background:#818cf8}.badge.other{background:#9ca3af}
.card h3{margin:0;font-size:calc(13px * var(--zoom,1));line-height:1.3;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0;font-size:calc(12px * var(--zoom,1));line-height:1.38;color:#c3cbe0;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* compact floating HUD ring at bottom-left so it never covers panel content */
#hud{position:fixed;left:14px;bottom:14px;top:auto;width:84px;aspect-ratio:1;z-index:7;color:#7fa6e0;transition:color .6s;cursor:grab;touch-action:none;user-select:none;container-type:inline-size}
body.noleft #hud{bottom:54px}
#hud[data-s=listening]{color:#22d3ee}#hud[data-s=thinking],#hud[data-s=searching]{color:#fbbf24}#hud[data-s=speaking]{color:#a78bfa}
#hud.drag{cursor:grabbing}
#hud::before{content:"";position:absolute;inset:3%;border-radius:50%;background:radial-gradient(circle,rgba(6,10,22,.88) 60%,rgba(6,10,22,.45) 72%,transparent 73%);backdrop-filter:blur(6px)}
#hud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px currentColor)}
#pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:66%;font-size:clamp(9.5px,10.5cqw,22px);line-height:1.25;color:#e8ecf5;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hud .grip{position:absolute;right:0;bottom:0;width:16px;height:16px;border:solid currentColor;border-width:0 2px 2px 0;border-radius:0 0 6px 0;cursor:nwse-resize;opacity:0;transition:opacity .2s}
#hud:hover .grip,#hud.drag .grip{opacity:.85}
@media (hover:none){#hud .grip{opacity:.5}}

@media (max-width:900px){
  #top{gap:5px;padding:0 6px}#top h1{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}#topState{display:none}#top .tgrp{display:none}#top .btn{padding:0 9px;font-size:12.5px}
  #mtabs{display:flex}
  #ws{padding:0 6px 6px}
  #left,#center,#right{width:100%!important;flex:1;min-width:0}
  body[data-mtab="panel"] #left,body[data-mtab="panel"] #right{display:none!important}
  body[data-mtab="panel"] #center{display:flex!important}
  body[data-mtab="cards"] #left,body[data-mtab="cards"] #center{display:none!important}
  body[data-mtab="cards"] #right{display:flex!important}
  body[data-mtab="left"] #center,body[data-mtab="left"] #right{display:none!important}
  body[data-mtab="left"] #left{display:flex!important}
  #zoom .zlbl,#subBtn{display:none}
  #panel{padding:8px 10px}
  #hud{left:12px;bottom:52px;top:auto;width:68px}
  #pbody,#cards,#trlist{padding-bottom:76px}
  #dev{position:static}#dev>div{position:fixed;left:8px;right:8px;top:52px;width:auto}
}
@media (prefers-reduced-motion:reduce){#teamlist .dot,.card,#user .kw.pop,#user.live::after,#panel,.md .fi,.md .flow li,.md tr.in,.md tr.in td{animation:none}}

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const demo = new URLSearchParams(location.search).get("demo") === "1";
const LABEL = { idle: "พร้อมคุย", listening: "กำลังฟัง…", thinking: "กำลังคิด…", searching: "กำลังคิด…", speaking: "กำลังพูด…" };
const SPIN = { idle: 0.15, listening: 0.3, thinking: 1.2, searching: 1.2, speaking: 0.5 }; // the HUD's spin per state, its color is CSS
const SRC = { web: ["เว็บ", 0x60a5fa], docs: ["เอกสารในเครื่อง", 0x4ade80], bcbrain: ["คลังความรู้ BC", 0xfb923c],
  gmail: ["อีเมล", 0xf87171], calendar: ["ปฏิทิน", 0xa78bfa], drive: ["Google Drive", 0xfacc15], desktop: ["คอมพิวเตอร์", 0x2dd4bf],
  calc: ["เครื่องคิดเลข", 0xe879f9], deepseek: ["ความรู้ทั่วไป", 0x818cf8], message: ["รับฝากข้อความ", 0x34d399] };
const OTHER_COLOR = 0x9ca3af; // any source string not in SRC

let state = "idle", statusText = "", userLevel = 0, botLevel = 0, panelText = "", panelBlocks = 0;
let savedPanels = [], viewingSaved = -1, totalCards = 0, userClosedRight = false;
const ui = { call: $("callBtn"), mic: $("micBtn"), pill: $("pill"), topState: $("topState"), user: $("user"), bot: $("bot"), cards: $("cards"), list: $("trlist"), note: $("note") };

/* ---------- UI state ---------- */
function render() {
  const txt = statusText || LABEL[state];
  ui.pill.textContent = txt;
  ui.topState.textContent = txt;
  ui.topState.dataset.s = state;
}
function setState(s) {
  if (s !== state) pulse = Math.max(pulse, 0.6); // every state change rings out from the HUD
  state = s; render(); hud.dataset.s = s;
  if (team.boss) { team.boss.st.textContent = BOSS[s]; team.boss.li.className = "boss" + (s === "idle" ? "" : " run"); }
}
function notice(msg) { ui.note.textContent = msg; }

/* ---------- workspace layout, subtitle toggle, zoom, copy ---------- */
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} };

let showLeft = lsGet("ui.left") !== "0", showRight = false, showSubs = lsGet("ui.subs") !== "0", prevMax = null;
function applyLayout() {
  $("left").hidden = !showLeft;
  $("right").hidden = !showRight;
  $("togLeft").setAttribute("aria-pressed", String(showLeft));
  $("togRight").setAttribute("aria-pressed", String(showRight));
  $("togMax").setAttribute("aria-pressed", String(!showLeft && !showRight));
  document.body.classList.toggle("noleft", !showLeft);
  document.body.classList.toggle("nosubs", !showSubs);
  $("subBtn").setAttribute("aria-pressed", String(showSubs));
}
$("togLeft").onclick = () => { showLeft = !showLeft; prevMax = null; lsSet("ui.left", showLeft ? "1" : "0"); applyLayout(); };
$("togRight").onclick = () => { showRight = !showRight; userClosedRight = !showRight; prevMax = null; applyLayout(); };
$("rClose").onclick = () => { showRight = false; userClosedRight = true; prevMax = null; applyLayout(); };
$("togMax").onclick = () => {
  if (showLeft || showRight) { prevMax = [showLeft, showRight]; showLeft = false; showRight = false; }
  else { [showLeft, showRight] = prevMax || [true, totalCards > 0]; prevMax = null; }
  lsSet("ui.left", showLeft ? "1" : "0");
  applyLayout();
};
$("subBtn").onclick = () => { showSubs = !showSubs; lsSet("ui.subs", showSubs ? "1" : "0"); applyLayout(); };
for (const b of document.querySelectorAll("#mtabs [data-tab]")) {
  b.onclick = () => {
    document.body.dataset.mtab = b.dataset.tab;
    for (const x of document.querySelectorAll("#mtabs [data-tab]")) x.setAttribute("aria-pressed", String(x === b));
  };
}
applyLayout();

// ลุงจืด 2026-11-13 "เพิ่มปุ่ม zoom + - ขนาดตัวอักษร": 80%..200% in 10% steps, kept in localStorage
const ZMIN = 80, ZMAX = 200, ZSTEP = 10;
let zoomPct = 100;
function setZoom(p) {
  zoomPct = Math.max(ZMIN, Math.min(ZMAX, Math.round(p / ZSTEP) * ZSTEP));
  document.documentElement.style.setProperty("--zoom", (zoomPct / 100).toFixed(2));
  $("zPct").textContent = zoomPct + "%";
  $("zOut").disabled = zoomPct <= ZMIN;
  $("zIn").disabled = zoomPct >= ZMAX;
  lsSet("zoom", zoomPct);
}
const zInit = +lsGet("zoom");
setZoom(zInit >= ZMIN && zInit <= ZMAX ? zInit : 100);
$("zOut").onclick = () => setZoom(zoomPct - ZSTEP);
$("zIn").onclick = () => setZoom(zoomPct + ZSTEP);
$("zPct").onclick = () => setZoom(100);

function copyText(text, btn) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "คัดลอกแล้ว ✓";
    setTimeout(() => { if (btn.textContent === "คัดลอกแล้ว ✓") btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = el("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta); ta.select();
  try { if (document.execCommand("copy")) done(); } catch {}
  ta.remove();
}
$("copyBtn").onclick = () => {
  const txt = nav.length ? $("pbody").innerText : (viewingSaved >= 0 ? savedPanels[viewingSaved]?.text : panelText) || $("pbody").innerText;
  if (txt) copyText(txt, $("copyBtn"));
};

let botLi = null, userWords = [], botWords = [], botPlayEnd = 0;
const SEG = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("th", { granularity: "word" }) : null;
const THAI_GAP = /([\u0e00-\u0e7f])\s+(?=[\u0e00-\u0e7f])/g;
function tidyThai(raw) { // join Whisper's word-by-word spaces inside Thai phrases while keeping clause pauses after ครับ/ค่ะ
  return String(raw || "").trim().replace(THAI_GAP, (m, left, off, s) => {
    const prev = s.slice(Math.max(0, off - 6), off + 1);
    return /(?:ครับ|ค่ะ|คะ|นะครับ|นะคะ)$/.test(prev) ? m : left;
  });
}
function splitKaraoke(text) {
  if (!text) return [];
  if (!SEG) return text.match(/\S+\s*/g) || [text];
  const out = [];
  for (const { segment } of SEG.segment(text)) {
    if (/^\s+$/.test(segment) && out.length) out[out.length - 1] += segment;
    else out.push(segment);
  }
  return out;
}
function showUserKaraoke(raw, isFinal) {
  const clean = tidyThai(raw);
  if (!clean) {
    userWords = [];
    if (isFinal) { ui.user.replaceChildren(); ui.user.classList.remove("live"); }
    else { ui.user.replaceChildren(el("span", "ulbl", "คุณ:")); ui.user.classList.add("live"); }
    return;
  }
  const next = splitKaraoke(clean);
  if (!ui.user.querySelector(".ulbl")) { ui.user.replaceChildren(el("span", "ulbl", "คุณ:")); userWords = []; }
  let same = 0;
  while (same < userWords.length && same < next.length && userWords[same] === next[same]) same++;
  const nodes = [...ui.user.querySelectorAll(".kw")];
  nodes.slice(same).forEach((n) => n.remove());
  for (let i = same; i < next.length; i++) ui.user.append(el("span", i >= userWords.length ? "kw pop" : "kw", next[i]));
  userWords = next;
  ui.user.classList.toggle("live", !isFinal);
  ui.user.scrollTop = ui.user.scrollHeight;
}
function clearBotKaraoke() {
  botWords = []; botPlayEnd = 0; ui.bot.replaceChildren();
}
function enqueueBotKaraoke(text, durSec, leadSec) {
  const raw = String(text || "");
  if (!raw.trim()) return;
  const now = performance.now(), leadMs = Math.max(0, (Number(leadSec) || 0) * 1000), start = Math.max(now, botPlayEnd) + leadMs;
  const durMs = Math.max(320, ((Number(durSec) > 0 ? Number(durSec) : Math.max(0.75, raw.length * 0.062)) * 1000));
  botPlayEnd = start + durMs;
  const parts = splitKaraoke(botWords.length && !/\s$/.test(botWords.at(-1).txt) ? " " + raw : raw);
  const weights = parts.map((w) => Math.max(1, w.trim().length)), totalW = weights.reduce((a, b) => a + b, 0) || 1;
  let cur = start;
  parts.forEach((w, i) => {
    const spanMs = durMs * (weights[i] / totalW), node = el("span", still ? "kw sung" : "kw wait", w);
    ui.bot.append(node);
    botWords.push({ el: node, txt: w, t0: cur, t1: cur + spanMs, st: still ? 2 : 0 });
    cur += spanMs;
  });
}
function tickBotKaraoke(now) {
  if (still || !botWords.length) return;
  for (const w of botWords) {
    if (now >= w.t1) {
      if (w.st !== 2) { w.st = 2; w.el.className = "kw sung"; w.el.style.removeProperty("--p"); }
    } else if (now >= w.t0) {
      if (w.st !== 1) {
        w.st = 1; w.el.className = "kw sing";
        const top = w.el.offsetTop - ui.bot.offsetTop;
        if (top > ui.bot.scrollTop + ui.bot.clientHeight - 24 || top < ui.bot.scrollTop) ui.bot.scrollTop = Math.max(0, top - 4);
      }
      w.el.style.setProperty("--p", `${Math.min(100, Math.max(0, ((now - w.t0) / Math.max(1, w.t1 - w.t0)) * 100)).toFixed(1)}%`);
    }
  }
}
function onEvent(ev) {
  if (ev.kind === "user") {
    const clean = tidyThai(ev.text);
    archivePanel(); hidePanel(); resetTeam(); $("remote").volume = 1; turnText = clean; turnBox = null;
    statusText = ""; showUserKaraoke(clean, true); clearBotKaraoke();
    if (clean) ui.list.append(el("li", "u", "คุณ: " + clean)); // "" = the secretary speaks first (greeting, reminder)
    botLi = el("li", "b", "ผู้ช่วย: "); ui.list.append(botLi);
    setState("thinking");
  } else if (ev.kind === "bot") {
    statusText = "";
    if (!botLi) { $("remote").volume = 1; botLi = el("li", "b", "ผู้ช่วย: "); ui.list.append(botLi); }
    enqueueBotKaraoke(ev.text, ev.dur, ev.lead);
    botLi.textContent += ev.text;
    setState("speaking");
  } else if (ev.kind === "status") {
    statusText = ev.text; setState("searching");
  } else if (ev.kind === "info") {
    addCard(ev);
  } else if (ev.kind === "team") {
    onTeam(ev);

const NUM_CELL = /^-?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/, CALM = matchMedia("(prefers-reduced-motion: reduce)");
function countUp(td, delay) { // a number cell runs up to its value and ends on the exact text the boss wrote
  const s = td.textContent.trim();
  if (CALM.matches || td.childElementCount || !NUM_CELL.test(s)) return;
  const v = +s.replace(/,/g, ""), dec = (s.split(".")[1] || "").length, t0 = performance.now() + delay;
  const fmt = { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: s.includes(",") };

function renderMd(box, text, animateFrom = Infinity) { // blocks that did not change stay put: a map replaced would reload
